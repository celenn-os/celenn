<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Parental controls: the child accounts (group cosmic-blue-children) look up
     names through DNS, which goes to the family filter, not through
     systemd-resolved's D-Bus methods, which would answer without it (its
     varlink socket is closed to them by cosmic-blue-parental-controls.service).
     Applies to sessions opened after the account became a child. -->
<busconfig>
  <policy group="cosmic-blue-children">
    <deny send_destination="org.freedesktop.resolve1"
          send_interface="org.freedesktop.resolve1.Manager" send_member="ResolveHostname"/>
    <deny send_destination="org.freedesktop.resolve1"
          send_interface="org.freedesktop.resolve1.Manager" send_member="ResolveAddress"/>
    <deny send_destination="org.freedesktop.resolve1"
          send_interface="org.freedesktop.resolve1.Manager" send_member="ResolveRecord"/>
    <deny send_destination="org.freedesktop.resolve1"
          send_interface="org.freedesktop.resolve1.Manager" send_member="ResolveService"/>
  </policy>
</busconfig>
