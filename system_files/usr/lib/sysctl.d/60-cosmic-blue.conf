# cosmic-blue system tuning (checked by build_files/99-tests.sh and, on a
# booted system, by vm_check_tuning in tests/vm-lib.sh). Fedora sets none of
# these. A file of the same name in /etc/sysctl.d replaces this one.

# Swap is zram, compressed RAM (zram-generator-defaults): swapping a page out
# costs a little CPU, far less than reading evicted files back from disk. A
# swappiness above 100 tells the kernel so (see the kernel's
# Documentation/admin-guide/sysctl/vm.rst), and swap readahead is useless on
# RAM. Same values as Pop!_OS, SteamOS and Bazzite. Keeps the desktop
# responsive when memory runs out.
vm.swappiness = 180
vm.page-cluster = 0

# Data waiting to be written: by default up to 20% of RAM (several GB), so a
# copy to a USB stick "finishes" long before the data is written and ejecting
# it then hangs for minutes. A fixed 256 MB keeps the progress bar honest and
# avoids long stalls; fast SSDs write that in well under a second. Same values
# as SteamOS and Bazzite.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728

# Each program that watches files (file manager, editors, Flatpak portals,
# Syncthing, Electron apps) takes inotify instances; the kernel default of 128
# per user runs out and apps fail with "too many open files". The number of
# watches is already sized from RAM by the kernel and is left alone.
fs.inotify.max_user_instances = 8192
