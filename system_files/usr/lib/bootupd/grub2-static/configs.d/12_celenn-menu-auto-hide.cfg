# Hide the GRUB menu (and its "Booting ..." line) while the previous boot
# went well, as Fedora does (grub2's 12_menu_auto_hide). bootupd's static
# configuration otherwise always shows the menu for one second.
# - boot_success is set by grub-boot-success.timer two minutes after a user
#   logs in, boot_indeterminate by a reboot during those two minutes.
# - After a failed boot, the menu is shown so that another (older) entry can
#   be picked. Esc, F8 or Shift during the one-second wait also shows it.
# - menu_show_once (grub2-set-bootflag menu_show_once) shows it on next boot.
# - `sudo grub2-editenv - set menu_auto_hide=0` keeps the menu always shown.
# The flags are only saved back when one of them was set from the running
# system, which shows that GRUB can write its environment block (it cannot
# on btrfs, where /boot is a directory of the root filesystem).
if [ "${boot_success}" = "1" -o "${boot_indeterminate}" = "1" ]; then
  set last_boot_ok=1
  if [ "${boot_success}" = "1" ]; then
    set boot_indeterminate=0
  else
    # Hide the menu only once after a boot that could not be confirmed
    set boot_indeterminate=2
  fi
  set boot_success=0
  save_env boot_success boot_indeterminate
else
  set last_boot_ok=0
fi
if [ x$feature_timeout_style = xy ]; then
  if [ "${menu_show_once}" ]; then
    unset menu_show_once
    save_env menu_show_once
    set timeout_style=menu
    set timeout=60
  elif [ "${menu_auto_hide}" != "0" -a "${last_boot_ok}" = "1" ]; then
    set timeout_style=hidden
    set timeout=1
  fi
fi
