# Weekly TRIM (fstrim.timer, enabled by Fedora): only look at what is
# actually mounted. Fedora's command reads /etc/fstab first, and on systems
# installed from the ISO its "/" line names the btrfs root, while "/" is in
# fact ostree's read-only composefs overlay, which cannot be trimmed. The
# mount table lists the real filesystems (/sysroot, /var, /boot, the EFI
# partition) and fstrim trims each device once. Same change as Bluefin and
# Aurora; see https://forge.fedoraproject.org/atomic/tracker/issues/81
[Service]
ExecStart=
ExecStart=/usr/bin/fstrim --listed-in /proc/self/mountinfo --verbose --quiet-unsupported
