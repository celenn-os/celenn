# The boot screen (Plymouth) stays on screen until the login screen draws,
# as GDM does, instead of a black screen of about 2 seconds between them.
# Plymouth lets go of the display (deactivate) so that the login screen's
# compositor can take it, then quits without clearing the screen
# (--retain-splash). The login screen no longer waits for Plymouth to quit
# (plymouth-quit-wait.service is taken out of its After= in
# build_files/20-cosmic.sh), and plymouth-quit.service, which would clear the
# screen, does not run alongside it; it still runs if the login screen fails.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service plymouth-start.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPost=-/usr/bin/plymouth quit --retain-splash
