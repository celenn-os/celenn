# tuned-ppd (power profiles for COSMIC, see build_files/50-services.sh) logs
# to /var/log/tuned/tuned-ppd.log. On cosmic-blue (seen with Fedora 45)
# /var/log/tuned can be created with the generic var_log_t SELinux label
# instead of tuned_log_t, and SELinux then denies tuned-ppd the write: the
# service fails at every boot. Create the directory with its proper label and
# restore the label of an existing one (and of its log files) at boot, before
# tuned and tuned-ppd start.
d /var/log/tuned 0755 root root -
Z /var/log/tuned - - - -
