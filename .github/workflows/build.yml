---
name: Build container image
# Channels (tags installed systems follow), as in Fedora CoreOS:
#   - dev: every change merged to main (tags dev and dev-<commit>, no version
#     number: the image shows e.g. 44.20261119-dev.abc1234),
#   - testing: one build a day with Fedora's package updates (tags testing,
#     latest for the systems installed before testing existed, the version
#     44.YYYYMMDD and the date YYYYMMDD),
#   - stable: a testing build a week old (promote-stable.yml).
# Triggers, without duplicate builds:
#   - pull requests: build and boot-test, nothing is published,
#   - pushes to main (merged pull requests, Renovate base image updates):
#     build and publish to dev,
#   - every day: build and publish to testing, unless testing was already
#     built by hand in the last hours,
#   - by hand (workflow_dispatch): testing by default, or dev
#     (check-cosmic-version.yml, after its merge).
# Changes that do not end up in the image (website, docs, other workflows,
# Renovate config) do not start a build.
on:
  pull_request:
    branches:
      - main
    # Same list for pushes to main (YAML anchor)
    paths-ignore: &not-in-image
      - '**/README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'docs/**'
      - 'website/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/renovate.json5'
      - '.github/scripts/**'
      - '.github/workflows/build-live-iso.yml'
      - 'tests/vm-iso-install-test.sh'
      - '.github/workflows/check-app-sources.yml'
      - 'tests/check-app-sources.sh'
      - '.github/workflows/check-cosmic-version.yml'
      - '.github/workflows/clean-images.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/promote-stable.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/test-update.yml'
      - 'tests/vm-update-test.sh'
      - '.github/workflows/lint.yml'
      - '.github/actionlint.yaml'
      - 'tests/lint.sh'
  schedule:
    # Every day at 06:17 UTC (07:17 in Paris in winter, 08:17 in summer):
    # ublue-os/base-main is rebuilt around 01:10 and 04:10 UTC, this leaves
    # a margin for a late upstream build. Not on the hour: GitHub delays
    # scheduled runs most at the top of the hour (up to 9 hours on 2026-11-17).
    - cron: '17 6 * * *'
  push:
    branches:
      - main
    paths-ignore: *not-in-image
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to publish to (from main)"
        type: choice
        options: [testing, dev]
        default: testing

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # The daily build is skipped if testing was built within this many hours
  RECENT_BUILD_HOURS: 8

# Pull requests: a new push cancels the running build. Main: builds queue up
# instead, so a publishing build is never cut short.
# The daily build has a group of its own: GitHub keeps only one pending run
# per group, so a daily run (often hours late) would otherwise replace the
# pending build of a just merged change, then skip itself as main was built
# recently, and that change would not be published (2026-11-17, #117). It
# skips itself while a testing build started by hand runs or waits
# (recent_build), and the version tag push refuses a version another build
# already took.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'daily' || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recent_build:
    name: Check for a recent build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a recent build of main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since="$(date -u -d "-${RECENT_BUILD_HOURS} hours" +%FT%TZ)"
          # Successful, running or queued testing builds of main (daily or
          # by hand; dev builds come from pushes), other than this run. A dev
          # build started by hand is counted too: rare, and harmless.
          recent="$(gh run list --workflow build.yml --branch main --limit 50 \
            --json databaseId,status,conclusion,createdAt,event,url \
            --jq "map(select(.databaseId != ${GITHUB_RUN_ID}
                  and (.event == \"schedule\" or .event == \"workflow_dispatch\")
                  and .createdAt >= \"${since}\"
                  and (.status != \"completed\" or .conclusion == \"success\")))
                  | .[0].url // empty")"
          if [ -n "${recent}" ]; then
            echo "testing was built in the last ${RECENT_BUILD_HOURS} hours, skipping: ${recent}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

  # The channel, and one version for all the images of this build. testing,
  # as in Bluefin: <Fedora>.<YYYYMMDD>, then .1, .2... if an image of the day
  # is already on GHCR (`just version`), which only happens when testing is
  # built again by hand. The daily build has a concurrency group of its own
  # (see above): a testing build started by hand while it runs can pick the
  # same version. The later push then stops, and the report job starts a new
  # testing build, which picks the next version.
  version:
    name: Pick the version
    needs: recent_build
    # recent_build only runs for the daily build
    if: >-
      !cancelled() &&
      (needs.recent_build.result == 'skipped' ||
       (needs.recent_build.result == 'success' && needs.recent_build.outputs.skip != 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # pr-images
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      suffixes: ${{ steps.images.outputs.suffixes }}
      full: ${{ steps.full.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pull requests that do not touch NVIDIA only build cosmic-blue
      - name: Pick the images
        id: images
        uses: ./.github/actions/pr-images
        env:
          GH_TOKEN: ${{ github.token }}

      # The rechunk and the SBOM only change how the image is published, not
      # what it holds: pull requests skip them (about 11 minutes), unless they
      # change these steps (Justfile, this workflow) or the base image whose
      # rpm-ostree does the rechunk (Renovate). Main builds always run them,
      # and boot-test the rechunked image before publishing it.
      - name: Pick the publishing steps to test
        id: full
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          full=true
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${HEAD_REF}" != renovate/* ]]; then
            # A diff too large for the API: run them
            if files="$(gh pr diff "${PR}" --repo "${GITHUB_REPOSITORY}" --name-only)" \
               && ! grep -qxE 'Justfile|Containerfile|\.github/workflows/build\.yml' <<< "${files}"; then
              full=false
              echo "::notice::The pull request does not touch the Justfile, the Containerfile or this workflow: no rechunk nor SBOM (main builds run them)"
            fi
          fi
          echo "full=${full}" >> "${GITHUB_OUTPUT}"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      # testing: the next free version of the day (`just version`). dev and
      # pull requests: the date and commit, never published as a version tag.
      - name: Pick the version
        id: version
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            schedule) channel=testing ;;
            workflow_dispatch) channel="${INPUT_CHANNEL:-testing}" ;;
            *) channel=dev ;;
          esac
          if [[ "${channel}" == testing ]]; then
            image="$(just image_name)"
            # Same images as the build_push matrix
            version="$(just version "${image}" "${image}-nvidia")"
          else
            version="$(just fedora-version).$(date -u +%Y%m%d)-dev.$(git rev-parse --short HEAD)"
          fi
          echo "Channel: ${channel}, version: ${version}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build_push:
    name: Build and push ${{ matrix.image_suffix && format('image ({0})', matrix.image_suffix) || 'image' }}
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-26.04
    # About 60 to 75 minutes; a stuck run would hold up the main builds queued
    # behind it
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # cosmic-blue, and cosmic-blue-nvidia with the NVIDIA driver
        # (build_files/35-nvidia.sh); only cosmic-blue for pull requests that
        # do not touch NVIDIA (.github/actions/pr-images)
        image_suffix: ${{ fromJSON(needs.version.outputs.suffixes) }}

    permissions:
      contents: read
      packages: write
    # The signing key (SIGNING_SECRET) lives in the "release" environment,
    # which only the main branch may use: builds of main take it, pull
    # requests and other branches run without an environment (and never
    # sign). An empty name means no environment.
    environment: ${{ (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && 'release' || '' }}

    # "true" when another build of main published this version first
    outputs:
      version_taken: ${{ steps.push-image.outputs.version_taken }}

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # Action versions are pinned to commits and updated by Renovate.
      # No git credentials left in the checkout: the build runs the
      # repository's scripts as root, and nothing here pushes to git.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)
          if [[ -n "${{ matrix.image_suffix }}" ]]; then
            IMAGE_NAME="${IMAGE_NAME}-${{ matrix.image_suffix }}"
          fi

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      # The local tag of the build: its channel (testing or dev)
      - name: Default Tag
        id: gen-default-tag
        env:
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          echo "DEFAULT_TAG=${CHANNEL}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # The image is built, rechunked, boot-tested and pushed in the root podman
      # storage, where `bootc install` (tests/vm-lib.sh) reads it: no copy from
      # the user storage (3 to 6 minutes, and a second copy on the disk).
      # ROOT_ENV runs a command as root with the variables the just recipes
      # read (sudo resets the environment), without the runner's runtime
      # directory (root podman would leave root-owned files there that break
      # rootless podman). GIT_OPTIONAL_LOCKS=0: `git status` leaves the
      # runner's index alone.
      - name: Use the root podman storage
        run: |
          set -euo pipefail
          root_env="sudo env -u XDG_RUNTIME_DIR -u DBUS_SESSION_BUS_ADDRESS PATH=${PATH} IMAGE_NAME=${IMAGE_NAME} GIT_OPTIONAL_LOCKS=0"
          echo "ROOT_ENV=${root_env}" >> "${GITHUB_ENV}"
          # git refuses, as root, a checkout owned by another user
          sudo git config --system --add safe.directory "${GITHUB_WORKSPACE}"
          # Without the native overlay diff, committing a layer walks the whole
          # image (minutes for each RUN step). Root overlay mounts lose it
          # with Ubuntu's metacopy=on and the kernel's redirect_dir default;
          # rootless podman can use neither, so it always had it.
          conf=/etc/containers/storage.conf
          [[ -f "${conf}" ]] || sudo cp /usr/share/containers/storage.conf "${conf}"
          sudo sed -i -E 's/,metacopy=on|metacopy=on,?//' "${conf}"
          sudo modprobe overlay
          for param in redirect_dir metacopy; do
            echo N | sudo tee "/sys/module/overlay/parameters/${param}" >/dev/null
          done
          ${root_env} podman info --format '{{ json .Store.GraphStatus }}'

      # Helper stages (Containerfile.helpers: rebuilt COSMIC programs, recolored
      # themes): each one restored from the Actions cache while its own inputs
      # do not change (`just helpers-keys`), built otherwise. Keep the list in
      # line with `just helper-stages`.
      - name: Helper stages cache keys
        id: helpers
        run: |
          set -euo pipefail
          just helpers-keys | while read -r stage key; do
            echo "${stage}=helper-${stage}-${key}" >> "${GITHUB_OUTPUT}"
          done

      - name: Helper stage theme
        uses: ./.github/actions/helper-stage
        with:
          stage: theme
          key: ${{ steps.helpers.outputs.theme }}
          dir: ${{ runner.temp }}/helpers
          cargo: 'true'
          cargo-lock: build_files/theme/Cargo.lock
          cargo-weekly: 'true'

      - name: Helper stage tour
        uses: ./.github/actions/helper-stage
        with:
          stage: tour
          key: ${{ steps.helpers.outputs.tour }}
          dir: ${{ runner.temp }}/helpers
          cargo: 'true'
          cargo-lock: build_files/first_steps/Cargo.lock
          cargo-weekly: 'true'

      - name: Helper stage greeter
        uses: ./.github/actions/helper-stage
        with:
          stage: greeter
          key: ${{ steps.helpers.outputs.greeter }}
          dir: ${{ runner.temp }}/helpers
          cargo: 'true'

      - name: Helper stage store
        uses: ./.github/actions/helper-stage
        with:
          stage: store
          key: ${{ steps.helpers.outputs.store }}
          dir: ${{ runner.temp }}/helpers
          cargo: 'true'

      - name: Helper stage filemanager
        uses: ./.github/actions/helper-stage
        with:
          stage: filemanager
          key: ${{ steps.helpers.outputs.filemanager }}
          dir: ${{ runner.temp }}/helpers
          cargo: 'true'

      - name: Helper stage plymouth
        uses: ./.github/actions/helper-stage
        with:
          stage: plymouth
          key: ${{ steps.helpers.outputs.plymouth }}
          dir: ${{ runner.temp }}/helpers

      - name: Helper stage icons
        uses: ./.github/actions/helper-stage
        with:
          stage: icons
          key: ${{ steps.helpers.outputs.icons }}
          dir: ${{ runner.temp }}/helpers

      - name: Helper stage cursors
        uses: ./.github/actions/helper-stage
        with:
          stage: cursors
          key: ${{ steps.helpers.outputs.cursors }}
          dir: ${{ runner.temp }}/helpers

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          HELPERS_DIR: ${{ runner.temp }}/helpers
        run: |
          ${ROOT_ENV} HELPERS_DIR="${HELPERS_DIR}" just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            ${VERSION}

      # Smaller delta updates for installed systems
      - name: Rechunk with rpm-ostree
        id: rechunk
        if: needs.version.outputs.full == 'true'
        run: |
          ${ROOT_ENV} just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG} \
                        ${VERSION})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          ${ROOT_ENV} just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # Software bill of materials (SPDX) of the image, from its mounted root
      # file system: the RPMs and the binaries installed outside them, not
      # every file they own nor the language libraries bundled inside them
      # (with every cataloger: 10,000 entries, 93 MB, 4.5 minutes). Made in
      # the background while the boot test runs (about 4 minutes saved), and
      # for pull requests only when they change it (see the version job);
      # attached to the published image after it is signed.
      - name: Install Syft
        if: needs.version.outputs.full == 'true'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft

      - name: Start the SBOM
        if: needs.version.outputs.full == 'true'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/sbom"
          mkdir -p "${dir}"
          root=$(${ROOT_ENV} podman image mount "localhost/${IMAGE_NAME}:${DEFAULT_TAG}")
          # At the lowest priority, so it slows the virtual machine the least
          nohup sudo nice -n 19 env SYFT_FILE_METADATA_SELECTION=none SYFT_CHECK_FOR_APP_UPDATE=false \
            sh -c '"$0" "$@"; echo $? > "'"${dir}"'/status"' \
            "${SYFT}" scan "dir:${root}" --quiet --select-catalogers rpm,binary \
            --source-name "${IMAGE_REGISTRY}/${IMAGE_NAME}" --source-version "${VERSION}" \
            -o "spdx-json=${dir}/sbom.spdx.json" > "${dir}/syft.log" 2>&1 &

      # Boot smoke test: install the image to a virtual disk, boot it in QEMU
      # and check the login screen comes up. A failing image is not pushed.
      - name: Prepare the boot test
        uses: ./.github/actions/vm-test-setup

      - name: Boot test
        timeout-minutes: 40
        env:
          TARGET_IMGREF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          # The virtual machine has no NVIDIA GPU for these to work with
          EXTRA_IGNORED_UNITS: ${{ matrix.image_suffix == 'nvidia' && 'nvidia-persistenced|nvidia-cdi-refresh' || '' }}
        run: |
          tests/vm-boot-test.sh "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" "${RUNNER_TEMP}/boot-test"

      # Logs, screenshots and the screenshot sheet linked from the run summary
      - name: Publish the boot test results
        if: always()
        uses: ./.github/actions/vm-test-results
        with:
          dir: ${{ runner.temp }}/boot-test
          name: boot-test-${{ env.IMAGE_NAME }}
          title: ${{ env.IMAGE_NAME }}

      - name: Finish the SBOM
        id: sbom
        if: needs.version.outputs.full == 'true'
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/sbom"
          file="${dir}/sbom.spdx.json"
          trap '${ROOT_ENV} podman image unmount "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" >/dev/null || true' EXIT
          for (( i = 0; i < 180; i++ )); do
            [[ -s "${dir}/status" ]] && break
            sleep 5
          done
          cat "${dir}/syft.log" || true
          status="$(cat "${dir}/status" 2>/dev/null || echo "none")"
          [[ "${status}" == 0 ]] || { echo "::error::Syft failed or did not finish (status: ${status})"; exit 1; }
          sudo chown "$(id -u):$(id -g)" "${file}"
          # Without the file lists Syft copies from the RPM database (every
          # file of every package: about 80 MB), down to the packages
          jq -c 'del(.files, .packages[].hasFiles) | .relationships |= map(select(.relationshipType != "CONTAINS"))' \
            "${file}" > "${file}.tmp"
          echo "SBOM before trimming: $(du -h "${file}" | cut -f1)"
          mv "${file}.tmp" "${file}"
          packages=$(jq '.packages | length' "${file}")
          rpms=$(jq '[.packages[] | select(.externalRefs[]?.referenceLocator | startswith("pkg:rpm/"))] | length' "${file}")
          echo "SBOM: ${packages} packages (${rpms} RPMs), $(du -h "${file}" | cut -f1)"
          # The image has well over a thousand RPMs: far fewer means a broken scan
          (( rpms > 500 )) || { echo "::error::Only ${rpms} RPMs in the SBOM"; exit 1; }
          echo "file=${file}" >> "${GITHUB_OUTPUT}"

      # The terminal crop (prompt and fastfetch) as base64 in the log, for
      # tools that can read job logs but not download artifacts (branches and
      # pull requests only, to keep the main build logs short)
      - name: Print the terminal screenshot
        if: always() && matrix.image_suffix == '' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          dir="${RUNNER_TEMP}/boot-test/screenshots"
          shot="${dir}/07-terminal-zoom.png"
          [[ -f "${shot}" ]] || shot="$(compgen -G "${dir}/07-terminal.*" | head -n 1 || true)"
          [[ -n "${shot}" ]] || { echo "No terminal screenshot"; exit 0; }
          python3 -c 'import sys; from PIL import Image; Image.open(sys.argv[1]).convert("RGB").save(sys.argv[2], "JPEG", quality=92)' \
            "${shot}" "${RUNNER_TEMP}/terminal.jpg"
          # Under 4000 lines: log readers often return only the last 5000
          echo "TERMINAL-JPEG-BEGIN"
          base64 -w 200 "${RUNNER_TEMP}/terminal.jpg"
          echo "TERMINAL-JPEG-END"

      # Only the default branch publishes: pull requests and other branches
      # (e.g. the COSMIC update branches) build and test the image only.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Installed systems only accept updates signed with the key matching
      # cosign.pub (/etc/containers/policy.json), so an unsigned image is an error.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      # Signed before it is published: the image is first pushed under its
      # own tag only (testing: 44.YYYYMMDD[.N], dev: dev-<commit>; nothing
      # follows them), signed by digest, and only then pushed under the tags
      # installed systems follow (testing, latest, dev). No unsigned channel
      # tag, even for a moment.
      - name: Push the version tag
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The login above is for cosign; root podman has its own credentials
          ${ROOT_ENV} podman login ghcr.io --username "${REGISTRY_USER}" --password-stdin <<< "${REGISTRY_PASSWORD}"
          read -r first _ <<< "${ALIAS_TAGS}"
          if [[ "${DEFAULT_TAG}" == testing ]]; then
            [[ "${first}" == "${VERSION}" ]] || { echo "::error::The first build tag (${first}) is not the version (${VERSION})"; exit 1; }
          else
            [[ "${first}" == dev-* ]] || { echo "::error::The first build tag (${first}) is not dev-<commit>"; exit 1; }
          fi
          # Two testing builds that ran at the same time (the daily build and
          # one started by hand) could pick the same version: the second one
          # stops here instead of replacing the first one's image under that
          # version. (A dev build of the same commit again replaces it.)
          if [[ "${DEFAULT_TAG}" == testing ]] && skopeo inspect --raw "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${first}" >/dev/null 2>&1; then
            echo "::error::${IMAGE_NAME}:${first} is already published by another build: a new build of main starts (report job)"
            echo "version_taken=true" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          set -x
          ${ROOT_ENV} podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${first}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${first}"
          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: "" # key generated without a password
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          if [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
            echo "::error::The SIGNING_SECRET secret is missing: installed systems would refuse this image"
            exit 1
          fi
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Push the other tags
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          read -r _ others <<< "${ALIAS_TAGS}"
          for tag in ${others}; do
            ${ROOT_ENV} podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            # Same manifest as the signed one, or the tag would be unsigned
            if [[ "$(< /tmp/digestfile)" != "${DIGEST}" ]]; then
              echo "::error::${tag} was pushed as $(< /tmp/digestfile), not as the signed ${DIGEST}"
              exit 1
            fi
          done

      # The SBOM as a signed attestation of the image (same key, same old
      # format as the signature), after the tags: it is not needed to install
      # or update, so a failure here does not hold back the update. Not in
      # the transparency log: the SBOM of a whole system is larger than its
      # entries allow. Check with cosign verify-attestation --key cosign.pub
      # --type spdxjson --insecure-ignore-tlog=true IMAGE
      - name: Attach the SBOM
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.push-image.outputs.digest }}
          SBOM: ${{ steps.sbom.outputs.file }}
        run: |
          cosign attest -y --new-bundle-format=false --use-signing-config=false --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate "${SBOM}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # A failed build of main (daily, merge, by hand) opens an issue, closed by
  # the next build that passes. A build that lost its version to another one
  # (see the version job) is started again, so the change it carries is
  # published: re-running only the failed jobs would reuse the taken version.
  report:
    name: Report the result
    needs: [recent_build, version, build_push]
    if: >-
      always() && github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write  # start a new build of main
      contents: read
      issues: write
    steps:
      - name: Start a new build of main
        # Not for the daily build: the build that took its version is newer
        if: needs.build_push.outputs.version_taken == 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::notice::This build's version was taken by another build: starting a new testing build of ${BRANCH}"
          gh workflow run build.yml --ref "${BRANCH}" -f channel=testing

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Report the result
        uses: ./.github/actions/failure-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || (needs.build_push.result == 'success' && 'success' || 'none') }}
