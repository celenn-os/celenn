name: Lint
# Static checks of pull requests, in about a minute: shellcheck on every shell
# script (tests/lint.sh) and actionlint on the workflows, so a script mistake
# shows before the image build and its boot test end.
on:
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'
      - 'system_files/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          tests/lint.sh

      # The image comes with its own shellcheck, which also checks the run:
      # scripts of the workflows
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        env:
          SHELLCHECK_OPTS: --severity=warning
        with:
          args: -color
