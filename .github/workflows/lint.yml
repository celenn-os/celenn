name: Lint
# Static checks of pull requests, in about a minute: shellcheck on every shell
# script and rustfmt on the Rust programs (tests/lint.sh), and actionlint on
# the workflows, so a script mistake
# shows before the image build and its boot test end. A change to the Renovate
# config is also checked: a mistake there makes Renovate stop quietly. So is a
# change to the prompt font: the committed font must be the one its script
# builds.
on:
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'
      - 'build_files/**.rs'
      - 'build_files/first_steps/po/**'
      - 'system_files/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/renovate.json5'
      - 'branding/prompt-font/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: shellcheck and rustfmt
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          command -v rustfmt >/dev/null || rustup component add rustfmt
          shellcheck --version
          rustfmt --version
          tests/lint.sh

      # The image comes with its own shellcheck, which also checks the run:
      # scripts of the workflows
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        env:
          SHELLCHECK_OPTS: --severity=warning
        with:
          args: -color

  renovate:
    name: Renovate config
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      # Updated by Renovate (see .github/renovate.json5)
      RENOVATE_VERSION: "44.234.1"
    steps:
      # Only when the pull request changes the config, or this workflow (a new
      # Node.js or Renovate version for the validator itself); the job is
      # skipped quickly otherwise
      - name: Check whether the Renovate config changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only | grep -qxE '\.github/(renovate\.json5|workflows/lint\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Renovate config and validator unchanged, nothing to check"
          fi

      - name: Checkout
        if: steps.changed.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Without a file argument it finds .github/renovate.json5 and checks it
      # as a repository config (with a path it would check a global config)
      - name: renovate-config-validator
        if: steps.changed.outputs.changed == 'true'
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  prompt-font:
    name: Prompt font
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Only when the pull request changes the font or its script; the job is
      # skipped quickly otherwise
      - name: Check whether the prompt font changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only | grep -qE '^(branding/prompt-font/|system_files/usr/share/fonts/cosmic-blue/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Prompt font unchanged, nothing to check"
          fi

      - name: Checkout
        if: steps.changed.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A change to build.py that was not followed by a rebuild of the font
      # never reaches the image: the build copies the committed font
      - name: Committed font matches its script
        if: steps.changed.outputs.changed == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q python3-fonttools
          python3 branding/prompt-font/build.py --check system_files/usr/share/fonts/cosmic-blue/cosmic-blue-prompt.ttf
