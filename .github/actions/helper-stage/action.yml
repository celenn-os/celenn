name: Helper stage
description: >-
  Restores the output of one helper stage of Containerfile.helpers from the
  Actions cache into <dir>/<stage>, or builds it (`just build-helpers`) and
  saves it to the cache. Each stage has its own cache entry, keyed on its own
  inputs (`just helpers-keys`), so a change to one stage only rebuilds that
  stage. Caches saved by main builds are shared with pull requests.
inputs:
  stage:
    description: Stage name, as listed by `just helper-stages`
    required: true
  key:
    description: Cache key of the stage
    required: true
  dir:
    description: Directory of the helper stage outputs
    required: true
  cargo:
    description: >-
      'true' for the Rust stages: when the stage is built, its compiled
      dependencies (the /cargo directory of Containerfile.helpers) are
      restored from the Actions cache and, on main, saved again, so a change
      to the program does not compile libcosmic again.
    required: false
    default: 'false'
  cargo-lock:
    description: Cargo.lock of the stage, if in the repository (part of the cache key)
    required: false
    default: ''
  cargo-weekly:
    description: >-
      'true' to start the cache over every week (the tour, rebuilt every week
      for new Fedora libraries)
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Restore the ${{ inputs.stage }} stage
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.dir }}/${{ inputs.stage }}
        key: ${{ inputs.key }}

    - name: Cargo cache key of the ${{ inputs.stage }} stage
      id: cargo
      if: steps.cache.outputs.cache-hit != 'true' && inputs.cargo == 'true'
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
        LOCK: ${{ inputs.cargo-lock }}
        WEEKLY: ${{ inputs.cargo-weekly }}
      run: |
        set -euo pipefail
        prefix="cargo-${STAGE}-f$(just fedora-version)-"
        [[ "${WEEKLY}" != true ]] || prefix+="$(date -u +%G-W%V)-"
        echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
        lock="${prefix}"
        [[ -z "${LOCK}" ]] || lock+="$(sha256sum < "${LOCK}" | cut -c1-16)-"
        echo "lock=${lock}" >> "${GITHUB_OUTPUT}"
        echo "dir=${RUNNER_TEMP}/cargo-cache" >> "${GITHUB_OUTPUT}"

    - name: Restore the compiled Rust dependencies
      if: steps.cargo.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cargo.outputs.dir }}/${{ inputs.stage }}
        key: ${{ steps.cargo.outputs.lock }}${{ github.run_id }}
        restore-keys: |
          ${{ steps.cargo.outputs.lock }}
          ${{ steps.cargo.outputs.prefix }}

    - name: Build the ${{ inputs.stage }} stage
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        STAGE: ${{ inputs.stage }}
        HELPERS_CARGO_CACHE: ${{ steps.cargo.outputs.dir }}
      run: just build-helpers "${DIR}" "${STAGE}"

    - name: Size of the compiled Rust dependencies
      if: steps.cargo.outcome == 'success'
      shell: bash
      env:
        CARGO_DIR: ${{ steps.cargo.outputs.dir }}/${{ inputs.stage }}
      run: du -sh "${CARGO_DIR}" || true

    # Only main builds save it: pull requests read main's caches
    - name: Save the compiled Rust dependencies
      if: >-
        steps.cargo.outcome == 'success' && github.event_name != 'pull_request' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cargo.outputs.dir }}/${{ inputs.stage }}
        key: ${{ steps.cargo.outputs.lock }}${{ github.run_id }}

    - name: Save the ${{ inputs.stage }} stage
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.dir }}/${{ inputs.stage }}
        key: ${{ inputs.key }}
